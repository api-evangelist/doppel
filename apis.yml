aid: doppel
name: Doppel
description: >-
  Doppel is an AI-native social engineering defense platform that protects brands, executives,
  and employees from AI-powered impersonation, phishing, fraud, and account takeover across
  domains, social media, ads, messaging apps, app stores, crypto surfaces, and the dark web.
  Its real-time Threat Graph correlates signals to detect and dismantle attacker infrastructure,
  unifying Digital Risk Protection, Human Risk Management, and Email Security. Doppel exposes a
  REST API (https://api.doppel.com/v1) for Brand Protection alerts, URL scanning, reports,
  protected assets, and phishing-simulation campaigns, plus webhooks for real-time events.
  Backed by a16z and Bessemer Venture Partners.
