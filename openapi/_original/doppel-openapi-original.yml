              properties:
                url:
                  type: string
                  description: URL to scan
                  format: uri
                  example: https://example.com
                associated_urls:
                  type: array
                  description: URLs associated with the main URL
                  items:
                    type: string
                    format: uri
                  example:
                  - https://associated1.com
                  - https://associated2.com
        required: true
      responses:
        '201':
          description: Scan for URL created successfully
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id:
                    type: string
                    format: uuid
                    description: ID of the created scan
        '400':
          description: Invalid input
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - api_key: []
        user_api_key: []
      x-google-quota:
        metricCosts:
          submit-scan-request: 1
  /scan/result:
    get:
      description: Get the suspiciousness result of a scan given the submitted scan's ID.
      summary: Get Scan Result
      operationId: get_scan_result
      tags:
      - scan
      x-google-backend:
        address: https://external-api-gateway-725058953679.us-west1.run.app
        jwt_audience: https://external-api-gateway-725058953679.us-west1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 30
      parameters:
      - $ref: '#/components/parameters/XOrganizationCodeHeader'
      - name: scan_id
        in: query
        required: true
        description: ID of the scan to retrieve results for
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successfully retrieved scan results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - PENDING
                    - COMPLETED
                    description: Current status of the scan
                  url:
                    type: string
                    description: URL that was submitted to be scanned for suspiciousness
                  scan_id:
                    type: string
                    format: uuid
                    description: ID of the scan
                  results:
                    type: array
                    description: Array of scan results (empty if status is PENDING)
                    items:
                      type: object
                      properties:
                        suspiciousness:
                          type: string
                          description: Suspiciousness of the scan result
                          enum:
                          - low
                          - medium
                          - high
                          - na
                        category:
                          type: string
                          description: Scan Type - what type of scan was performed
                          enum:
                          - phishing
                        scan_data:
                          type: object
                          description: Additional data about the scan result
                          additionalProperties: true
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp when the scan result was created
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - api_key: []
        user_api_key: []
      x-google-quota:
        metricCosts:
          get-scan-result-request: 1
webhooks:
  alert_updated:
    post:
      operationId: alert_updated
      summary: Alert Updated
      description: This webhook is fired when an alert is updated in our system.
      tags:
      - alerts
      requestBody:
        description: Information about the Alert that was updated. The alert ID, the alert's Doppel URL,
          its display ID, and other relevant miscellaeneous fields are also included.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Top-level webhook payload, containing the event type and the event-specific
                payload.
              required:
              - event_type
              - timestamp
              - updated_values
              - initial_values
              - alert
              properties:
                event_type:
                  type: string
                  description: The type of event that occurred.
                  enum:
                  - alert_updated
                timestamp:
                  type: string
                  format: date-time
                  description: Timestamp of the alert update.
                updated_values:
                  type: object
                  description: Key-value pairs of fields that were updated in the alert.
                  properties:
                    queue_state:
                      example: doppel_review
                      type: string
                    entity_state:
                      example: active
                      type: string
                    notes:
                      example: Custom alert notes here.
                      type: string
                    tag_add:
                      example: example_tag
                      type: string
                    tag_remove:
                      example: example_tag
                      type: string
                    file_action:
                      example: Uploaded file.txt
                      type: string
                    severity:
                      example: high
                      type: string
                initial_values:
                  type: object
                  description: Initial key-value pairs of fields that were updated in the alert.
                  properties:
                    queue_state:
                      example: monitoring
                      type: string
                    entity_state:
                      example: down
                      type: string
                    notes:
                      example: Custom alert notes here.
                      type: string
                    tag_add:
                      example: example_tag
                      type: string
                    tag_remove:
                      example: example_tag
                      type: string
                    file_action:
                      example: Uploaded file.txt
                      type: string
                    severity:
                      example: low
                      type: string
                alert:
                  $ref: '#/components/schemas/AlertUpdatedPayload'
      responses:
        '201':
          description: Webhook notification received successfully, and acted upon synchronously.
        '202':
          description: Webhook notification received successfully, but will be acted upon asynchronously.
        '400':
          description: Invalid payload received.
  hrm_event:
    post:
      operationId: hrm_event
      summary: HRM Campaign Event
      description: 'This webhook is fired when a Human Risk Management (HRM) phishing simulation campaign
        engagement event is recorded. Events include attack delivery (email_sent), target interactions
        (email_opened, link_visited, data_submitted), training outcomes (training_accessed, quiz_passed,
        quiz_failed), reporting (email_reported), voice call results (call_answered, call_missed), and
        voice behavior analysis labels (refusal, disclosure_full, security_escalation, etc.).

        '
      tags:
      - hrm
      requestBody:
        description: 'Information about the HRM campaign engagement event, including the action type,
          campaign and user identifiers, and optional context like attack vector and device type. For
          Splunk integrations, this payload is wrapped in a Splunk HEC envelope with sourcetype "doppel_hrm_events".

          '
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Top-level webhook payload, containing the event type and the event-specific
                payload.
              required:
              - event_type
              - timestamp
              - payload
              properties:
                event_type:
                  type: string
                  description: The type of event that occurred.
                  enum:
                  - hrm_event
                timestamp:
                  type: string
                  format: date-time
                  description: Timestamp of when the event was recorded.
                  example: '2026-03-12T17:15:00.123456'
                payload:
                  $ref: '#/components/schemas/HrmEventPayload'
      responses:
        '201':
          description: Webhook notification received successfully, and acted upon synchronously.
        '202':
          description: Webhook notification received successfully, but will be acted upon asynchronously.
        '400':
          description: Invalid payload received.
  ioc_updated:
    post:
      operationId: ioc_updated
      summary: IOC Updated Webhook
      description: This webhook is fired whenever an IOC is updated in our system. Please contact our
        team if you are interested in subscribing to this webhook.
      tags:
      - iocs
      requestBody:
        description: Information about the IOC event.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IOCUpdatedPayload'
      responses:
        '201':
          description: Webhook notification received successfully, and acted upon synchronously.
        '202':
          description: Webhook notification received successfully, but will be acted upon asynchronously.
        '400':
          description: Invalid payload received.
  report_surfaced:
    post:
      operationId: report_surfaced
      summary: Report Surfaced
      description: This webhook is fired when a report is surfaced in our system. The new report may have
        any number of URLs associated with it, and may contain audit logs for events prior to surfacing.
      tags:
      - reports (deprecated)
      requestBody:
        description: Information about the Report Surfaced event, including the report ID, the list of
          surfaced URLs, the report's Doppel URL, and its display ID. Subscribing endpoints will receive
          a JSON object with the following fields.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Top-level webhook payload, containing the event type and the event-specific
                payload.
              required:
              - event_type
              - payload
              properties:
                event_type:
                  type: string
                  description: The type of event that occurred.
                  enum:
                  - report_surfaced
                payload:
                  $ref: '#/components/schemas/ReportSurfacedPayload'
      responses:
        '201':
          description: Webhook notification received successfully, and acted upon synchronously.
        '202':
          description: Webhook notification received successfully, but will be acted upon asynchronously.
        '400':
          description: Invalid payload received.
  sms_response:
    post:
      operationId: sms_response
      summary: SMS Response
      description: This webhook is fired whenever an SMS response is received from a Twilio outreach campaign.
      tags:
      - sms_responses
      requestBody:
        description: Information about the SMS Response event, including the message details, sender information,
          and campaign context. Subscribing endpoints will receive a JSON object with the following fields.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Top-level webhook payload, containing the event type and the event-specific
                payload.
              required:
              - event_type
              - payload
              properties:
                event_type:
                  type: string
                  description: The type of event that occurred.
                  enum:
                  - sms_response
                payload:
                  $ref: '#/components/schemas/SMSResponsePayload'
      responses:
        '201':
          description: Webhook notification received successfully, and acted upon synchronously.
        '202':
          description: Webhook notification received successfully, but will be acted upon asynchronously.
        '400':
          description: Invalid payload received.
  url_surfaced:
    post:
      operationId: url_surfaced
      summary: URL Surfaced
      description: This webhook is fired whenever any URL appears in our system. The new URL may be associated
        with a newly-created or already-existing report.
      tags:
      - urls
      requestBody:
        description: Information about the URL Surfaced event, such as the URL, the report ID it is associated
          with, and the Doppel URL of the report. Subscribing endpoints will receive a JSON object with
          the following fields.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Top-level webhook payload, containing the event type and the event-specific
                payload.
              required:
              - event_type
              - payload
              properties:
                event_type:
                  type: string
                  description: The type of event that occurred.
                  enum:
                  - url_surfaced
                payload:
                  $ref: '#/components/schemas/UrlSurfacedPayload'
      responses:
        '201':
          description: Webhook notification received successfully, and acted upon synchronously.
        '202':
          description: Webhook notification received successfully, but will be acted upon asynchronously.
        '400':
          description: Invalid payload received.
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
      description: API key from Doppel Vision API settings. Required for gateway authentication and quota.
    user_api_key:
      type: apiKey
      name: x-user-api-key
      in: header
      description: User API key from Doppel Vision API settings. Required together with x-api-key for
        authenticated requests.
  schemas:
    AlertCreatedResponse:
      title: AlertCreatedResponse
      description: 'Lightweight response returned by POST /alert. Contains the alert ID and link but not
        the full alert details.

        Use GET /alert with the returned `id` to retrieve the full alert object.

        '
      type: object
      properties:
        id:
          type: string
          description: Alert ID in the format ORG-NUMBER (e.g. ACM-1234).
          example: ACM-1234
        entity:
          description: The URL or phone number submitted for the alert.
          type: string
          example: https://suspicious-site.example.com
        doppel_link:
          description: Direct link to the alert in the Doppel Vision web app.
          type: string
          example: https://app.doppel.com/alerts/ACM-1234
        last_activity:
          description: Timestamp of the most recent activity on this alert (ISO 8601).
          type: string
          format: date-time
          example: '2024-06-15T10:30:00'
        message:
          description: Additional context about the response. Present when the alert already exists (e.g.
            "Alert exists but with different brand. To update brand contact support.").
          type: string
        file_results:
          description: Results of file operations, only present when files were included in the request.
          type: array
          items:
            $ref: '#/components/schemas/FileResult'
    AlertDarkWebCredentialData:
      type: object
      description: If the alert is a Credential Leak from Dark Web, this contains its credential data.
      properties:
        credential_url:
          type: string
          description: URL in which the leaked credentials were found.
        network:
          type: string
          description: Network of the URL in which the leaked credentials were found.
          example: ONION.V2
        email:
          type: string
          description: Email of the leaked credentials.
        password:
          type: string
          description: Password of the leaked credentials.
    AlertResponse:
      title: AlertResponse
      description: 'Full alert object returned by GET /alert, GET /alerts, and PUT /alert.

        Represents a single threat alert tracked by Doppel across any product type (domains, social media,
        mobile apps, etc.).

        '
      type: object
      properties:
        id:
          type: string
          description: Alert ID in the format ORG-NUMBER (e.g. ACM-1234). The prefix is your organization's
            abbreviation.
          example: ACM-1234
        entity:
          description: The URL, phone number, or email being tracked by this alert.
          type: string
          example: https://suspicious-site.example.com
        brand:
          description: The brand name this alert is associated with.
          type: string
          example: Acme Corp
        doppel_link:
          description: Direct link to this alert in the Doppel Vision web app.
          type: string
          example: https://app.doppel.com/alerts/ACM-1234
        queue_state:
          $ref: '#/components/schemas/QueueState'
        entity_state:
          $ref: '#/components/schemas/EntityState'
        severity:
          $ref: '#/components/schemas/Severity'
        source:
          $ref: '#/components/schemas/ReportSource'
        product:
          $ref: '#/components/schemas/Product'
        platform:
          description: The specific platform the alert is associated with (e.g. Twitter, Facebook, Linkedin).
            More granular than product.
          type: string
          example: twitter
        notes:
          description: Latest comment associated with the alert.
          type: string
        uploaded_by:
          description: Email of the user who submitted the alert, or "Doppel" if sourced automatically.
          type: string
          example: jane.doe@company.com
        assignee:
          description: Email of the user currently assigned to handle this alert.
          type: string
          example: john.doe@company.com
        created_at:
          description: Timestamp when the alert was created (ISO 8601).
          type: string
          format: date-time
          example: '2024-06-15T10:30:00'
        screenshot_url:
          description: Signed URL of the screenshot associated with the alert. Expires after 1 hour. May
            be null if no screenshot is available.
          type: string
        audit_logs:
          description: Chronological list of visible changes made to this alert.
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        tags:
          description: List of tags associated with this alert.
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the tag.
            example:
              name: Credential Theft
        entity_content:
          $ref: '#/components/schemas/EntityContent'
        last_activity:
          description: 'Timestamp of the most recent activity on this alert (ISO 8601).

            Note: GET /alerts returns this field as `last_activity_timestamp` instead.

            '
          type: string
          format: date-time
          example: '2024-06-20T14:00:00'
        score:
          description: 'Numeric severity score for the alert, ranging from 0.0 to 1.0 (higher = more severe).
            May be null.

            '
          type: number
          format: float
          minimum: 0
          maximum: 1
        file_results:
          description: Results of file operations, only present when files were included in the request
            (PUT /alert).
          type: array
          items:
            $ref: '#/components/schemas/FileResult'
        alert_summary:
          description: 'AI-generated summary of the alert, returned by GET /alert, GET /alerts, and PUT
            /alert.

            May be null when summary generation is still in progress, no visible summary exists, or

            the summary is withheld for restricted users on redacted dark-web alerts.

            '
          type: string
          example: This alert tracks a phishing domain impersonating Acme Corp login pages.
    AlertUpdatedPayload:
      type: object
      description: Payload type for the "Alert Updated" webhook.
      required:
      - id
      - doppel_link
      - created_at
      - entity
      - entity_state
      - queue_state
      - severity
      - product
      - source
      - notes
      - uploaded_by
      - tags
      properties:
        id:
          type: string
          description: ID of the surfaced alert.
          example: ABC-12345
        doppel_link:
          type: string
          description: Accessible link to the surfaced alert in Doppel Vision.
          example: https://app.doppel.com/domains/ABC-12345
        created_at:
          type: string
          format: date-time
          description: Timestamp of when the alert was initially created.
          example: '2024-08-20T15:30:00Z'
        entity:
          type: string
          description: Value representing the potentially malicious entity identified by the alert.
          example: https://example.surfaced-domain.com
        entity_state:
          type: string
          description: Current state of the potentially malicious entity identified by the alert.
          example: active
        queue_state:
          type: string
          description: Current queue that the potentially malicious entity is in.
          example: doppel_review
        severity:
          type: string
          description: Severity of the alert's suspiciousness.
          example: high
        product:
          type: string
          description: Product type associated with the alert.
          example: domains
        source:
          type: string
          description: Source of the alert.
          example: whoisxml_streaming
        notes:
          type: string
          description: Notes associated with the alert.
          example: This alert was marked as 'down' on 2024-08-20.
        uploaded_by:
          type: string
          description: Email of the Doppel user who uploaded the alert.
          example: example@gmail.com
        tags:
          type: array
          description: A list of external tags associated with the alert.
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the tag.
        brand:
          type: string
          nullable: true
          description: The brand associated with the alert.
        brand_type:
          type: string
          nullable: true
          description: The brand type associated with the alert (for example, organization_brand or personal_brand).
        credential_data:
          $ref: '#/components/schemas/AlertDarkWebCredentialData'
        has_credit_card_data:
          type: boolean
          description: This is true if the report dark web contains associated credit card data. Data
            itself is not shown.
    AuditLog:
      title: AuditLog
      description: A log of the changes on a report.
      type: object
      properties:
        changed_by:
          type: string
          description: Email of the user who made the change, or "Doppel".
        value:
          type: string
          description: New log value
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the change was made.
        type:
          type: string
          description: Type of audit log.
        metadata:
          title: Metadata
          description: Metadata for audit log.
          type: object
          properties:
            enforcement_request:
              description: Enforcement request information.
              type: object
              properties:
                platform:
                  description: Platform where the enforcement request was made.
                  type: string
                type:
                  description: Type of enforcement request.
                  type: string
            match:
              description: Match information.
              type: object
              properties:
                domain:
                  description: Domain information.
                  type: object
                  properties:
                    url:
                      description: URL associated with metadata.
                      type: string
    BrandResponse:
      title: BrandResponse
      description: Response model for a single brand
      type: object
      required:
      - id
      - name
      - brand_type
      - created_at
      properties:
        id:
          type: string
          description: Unique identifier for the brand
        name:
          type: string
          description: Brand name
        brand_type:
          type: string
          description: Brand type (e.g., organization_brand)
        created_at:
          type: string
          description: Timestamp when the brand was created
        updated_at:
          type: string
          description: Timestamp when the brand was last updated
    CreateProtectedAssetRequest:
      title: CreateProtectedAssetRequest
      description: Request model for creating a protected asset
      type: object
      required:
      - brand_ids
      - asset_value
      properties:
        brand_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
          description: List of brand IDs to associate with asset (1-100 brand IDs)
          example:
          - 123e4567-e89b-12d3-a456-426614174000
        asset_value:
          type: string
          description: The protected asset value (URL, handle, identifier, etc.)
          example: https://linkedin.com/company/example
    CreateProtectedAssetResponse:
      title: CreateProtectedAssetResponse
      description: Response model for created protected asset
      type: object
      required:
      - data
      - message
      properties:
        data:
          $ref: '#/components/schemas/ProtectedAssetResponse'
        message:
          type: string
          description: Success message
          example: Protected asset created successfully
    DeleteProtectedAssetResponse:
      title: DeleteProtectedAssetResponse
      description: Response model for deleted protected asset
      type: object
      required:
      - id
      - message
      properties:
        id:
          type: string
          description: ID of the deleted protected asset
          example: 123e4567-e89b-12d3-a456-426614174000
        message:
          type: string
          description: Success message
          example: Protected asset deleted successfully
    EntityContent:
      description: 'Content related to the entity of the alert, if available, for the following product
        types: domains, social media posts, social media users, social media groups, mobile apps, ecommerce,
        emails and paid advertisements. Object fields vary based on product type and availability.


        Possible keys and their fields:

        - `root_domain` (product: domains): `domain`, `registrar`, `ip_address`, `country_code`, `hosting_provider`,
        `contact_email`, `mx_records`, `nameservers`

        - `social_media_user` (product: social_media): `account_created_at`, `slug`, `profile_display_name`,
        `profile_image_url`, `profile_id`, `num_followers`, `profile_description`, `profile_display_url`

        - `social_media_post` (product: social_media): `external_created_at`, `num_upvotes`, `full_text`,
        `extra_urls`

        - `social_media_group` (product: social_media): `external_created_at`, `name`, `description`,
        `num_members`, `image_url`

        - `mobile_app` (product: mobile_apps): `external_created_at`, `title`, `platform_name`, `app_id`,
        `bundle_id`, `developer_id`, `developer_name`

        - `ecommerce` (product: ecommerce): `price`, `num_units`, `title`, `seller_name`, `description`,
        `telegram_link`

        - `email` (product: email): `subject`, `forwarder`, `sender`, `receiver`, `cc`, `bcc`, `eml_url`,
        `body`

        - `telco` (product: telco): `entity_created_at`, `entity_updated_at`, `country_code`, `telco_provider`

        - `advertisement_data` (product: paid_ads): `ad_detail_link`, `destination_url`, `text_content`,
        `date_first_shown`, `date_last_shown`, `advertiser_data`

        '
      type: object
      additionalProperties: true
    EntityState:
      description: 'The live status of the entity (URL, phone number, etc.) that the alert is tracking.

        - `active`: The entity is currently live/accessible.

        - `down`: The entity is no longer accessible (e.g. domain taken down).

        - `parked`: The domain is parked (registered but not hosting active content).

        - `suspicious`: The entity appears to be malicious or suspicious.

        - `unclassified`: The entity has not yet been classified.

        - `unrelated`: The entity has been determined to be unrelated to the brand.

        - `related`: The entity is related to the brand but not necessarily malicious.

        - `unknown`: The entity''s status cannot be determined.

        '
      type: string
      enum:
      - active
      - down
      - parked
      - suspicious
      - unclassified
      - unrelated
      - related
      - unknown
    ErrorResponse:
      title: ErrorResponse
      description: Standard error response returned for all non-2xx responses. Contains a single `message`
        field with a human-readable error description.
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Human-readable error description.
          example: This is an error message
    FileActionType:
      description: 'Type of file operation to perform on an alert.

        - `upload`: Upload new files (file_to_upload is required for each file).

        - `delete`: Delete existing files (only file_name is required).

        '
      type: string
      enum:
      - upload
      - delete
    FileInput:
      description: A file to upload or delete.
      type: object
      required:
      - file_name
      properties:
        file_name:
          type: string
          description: Name of the file (e.g. "evidence.png"). Must not contain path separators or start
            with a dot.
        file_to_upload:
          type: string
          format: byte
          description: 'Base64-encoded file content. Required when file_action is "upload". Maximum file
            size is 50MB.

            Supported file extensions: .csv, .docx, .eml, .exe, .gif, .html, .jfif, .jpg, .jpeg, .js,
            .m4a, .mov, .mp3, .mp4, .msg, .odt, .pdf, .png, .pptx, .rtf, .snagx, .tsv, .txt, .wav, .webp,
            .xlsx, .zip (files with no extension are also accepted).

            For Telco alerts, uploaded image files may be copied into canonical screenshot storage and
            used as the alert screenshot. The uploaded-file copy remains separate from the screenshot
            copy.

            '
    FileResult:
      description: Result of an individual file operation.
      type: object
      properties:
        file_name:
          type: string
        success:
          type: boolean
        error:
          type: string
          description: Error message if the file operation failed. Only present when success is false.
    GetBrandResponse:
      title: GetBrandResponse
      description: Response model for list of brands
      type: object
      required:
      - data
      - count
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BrandResponse'
        count:
          type: integer
          description: Total number of brands returned
    HrmCampaignResponse:
      type: object
      required:
      - id
      - name
      - status
      - campaign_type
      - is_test
      properties:
        id:
          type: string
          description: Campaign ID
        name:
          type: string
          description: Campaign name
        status:
          type: string
          description: Campaign status (e.g. pending, in_progress, finished)
        campaign_type:
          type: string
          description: Campaign type (e.g. simulation)
        launch_date:
          type: string
          description: ISO 8601 launch date
        end_date:
          type: string
          description: ISO 8601 end date
        created_at:
          type: string
          description: ISO 8601 creation timestamp
        is_test:
          type: boolean
          description: Whether this is a test campaign
    HrmEventPayload:
      type: object
      description: Payload type for the "HRM Event" webhook. Fired when a phishing simulation campaign
        engagement event is recorded (e.g., a target opens an attack email, clicks a link, submits data,
        completes training, or answers a vishing call).
      required:
      - action
      - campaign_id
      properties:
        action:
          type: string
          description: 'The engagement action that was recorded. Values come from the SimCampaignActions
            enum (e.g., email_opened, link_visited, data_submitted, quiz_passed) or voice behavior labels
            (e.g., refusal, disclosure_full, security_escalation).

            '
          example: link_visited
        campaign_id:
          type: string
          format: uuid
          description: ID of the phishing simulation campaign.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        sim_user_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the simulated user (target) who performed the action.
          example: 12345678-abcd-ef01-2345-6789abcdef01
        sim_attack_instance_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the specific attack instance (email, SMS, voice call, etc.) the action relates
            to.
          example: abcdef01-2345-6789-abcd-ef0123456789
        source:
          type: string
          nullable: true
          description: Attack vector or source context (e.g., "qr_code", "link", "voice_followup_email",
            "voice_followup_sms").
          example: link
        device_type:
          type: string
          nullable: true
          description: Device type of the target user when the action was recorded.
          enum:
          - Desktop
          - Mobile
          - Tablet
          example: Mobile
    HrmEventResponse:
      type: object
      required:
      - id
      - campaign_id
      - action
      properties:
        id:
          type: string
          description: Event ID
        campaign_id:
          type: string
          description: Campaign ID this event belongs to
        action:
          type: string
          description: Event type (e.g. email_opened, link_visited, data_submitted, email_reported)
        created_at:
          type: string
          description: ISO 8601 timestamp
        sim_user_id:
          type: string
          description: Sim user ID
        user_email:
          type: string
          description: User email address
        user_first_name:
          type: string
          description: User first name
        user_last_name:
          type: string
          description: User last name
        department:
          type: string
          description: User department
        manager_email:
          type: string
          description: User manager email address
        country:
          type: string
          description: User country
        device_type:
          type: string
          description: Device type (e.g. desktop, mobile)
        source:
          type: string
          description: Event source
    IOCUpdatedPayload:
      type: object
      description: Payload type for the IOC updated webhook.
      required:
      - id
      - created_at
      - type
      - indicator
      - status
      properties:
        id:
          type: string
          description: Unique identifier for the IOC.
        created_at:
          type: string
          format: date-time
          description: Timestamp of the IOC creation.
        type:
          type: string
          description: Type of the IOC, e.g., LINK, FILE, etc.
        indicator:
          type: string
          description: The actual IOC indicator, e.g., domain name, file hash.
        status:
          type: string
          description: Status of the IOC, e.g., MALICIOUS, SUSPICIOUS.
    ListCampaignsResponse:
      type: object
      required:
      - data
      - count
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HrmCampaignResponse'
        count:
          type: integer
          description: Total number of matching campaigns
    ListEventsResponse:
      type: object
      required:
      - data
      - count
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HrmEventResponse'
        count:
          type: integer
          description: Total number of matching events
    ListProtectedAssetsResponse:
      title: ListProtectedAssetsResponse
      description: Response model for list of protected assets
      type: object
      required:
      - data
      - count
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProtectedAssetResponse'
        count:
          type: integer
          description: Total number of protected assets returned
    Product:
      description: Product category the report belongs to.
      type: string
      enum:
      - domains
      - social_media
      - mobile_apps
      - ecommerce
      - crypto
      - email
      - paid_ads
      - telco
      - darkweb
    ProtectedAssetResponse:
      title: ProtectedAssetResponse
      description: Response model for a single protected asset
      type: object
      required:
      - id
      - brand_ids
      - asset_value
      - created_at
      properties:
        id:
          type: string
          description: Unique identifier for the protected asset
        brand_ids:
          type: array
          items:
            type: string
          description: List of brand IDs associated with this protected asset
        platform:
          type: string
          description: Specific platform (e.g., linkedin, facebook, twitter, domains, instagram). Shown
            as "Type" in the Doppel dashboard.
          enum:
          - domains
          - twitter
          - facebook
          - instagram
          - youtube
          - tiktok
          - linkedin
          - reddit
          - github
          - telegram
          - discord
          - pinterest
          - snapchat
          - whatsapp
          - medium
          - tumblr
          - twitch
          - spotify
          - threads
          - bluesky
          - truth_social
          - weibo
          - wechat
          - apple_app_store
          - google_play_store
          - amazon
          - ebay
          - alibaba
          - etsy
          - walmart
          - shopee
          - facebook_marketplace
          - coinbase
          - binance
          - opensea
          - email
          - darkweb
          - telco
          - google_ads
          - facebook_ads
          - bing_ads
        asset_value:
          type: string
          description: The protected asset value (URL, handle, identifier, etc.)
        created_at:
          type: string
          format: date-time
          description: Timestamp when the asset was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the asset was last updated
        updated_by:
          type: string
          description: User who last updated the asset. Changes made by Doppel on your behalf are shown
            as "Doppel". Null when the last editor is unknown.
    QueueState:
      description: 'The workflow queue an alert is currently in. Maps to the status columns in Doppel
        Vision.

        - `doppel_review`: Under review by Doppel''s internal team.

        - `needs_confirmation`: Awaiting customer confirmation before enforcement action.

        - `actioned`: Enforcement action has been taken (e.g. takedown request sent).

        - `taken_down`: Threat has been resolved. Equivalent to "Resolved" in Doppel Vision.

        - `monitoring`: Being actively monitored but no enforcement action taken yet.

        - `archived`: Dismissed or no longer relevant.

        '
      type: string
      enum:
      - doppel_review
      - needs_confirmation
      - actioned
      - taken_down
      - monitoring
      - archived
    ReportClassification:
      description: New classification to update a report's url with (url required)
      type: string
      enum:
      - suspicious
      - down
      - parked
      - active
    ReportResponse:
      title: ReportResponse
      description: Doppel report schema
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the reported URL
        display_id:
          type: string
          description: Unique identifier for the report (e.g. TST-1234)
        submitted_url:
          description: URL submitted for report
          type: string
        doppel_url:
          description: Doppel URL of the report that was created
          type: string
        report_status:
          $ref: '#/components/schemas/ReportStatus'
        classification:
          $ref: '#/components/schemas/ReportClassification'
        product:
          $ref: '#/components/schemas/Product'
        source:
          $ref: '#/components/schemas/ReportSource'
        notes:
          description: Notes associated with a report.
          type: string
        uploaded_by:
          description: Email of the user who submitted the report, or "Doppel".
          type: string
        created_at:
          description: Timestamp when the report was created.
          type: string
          format: date-time
        matches:
          description: A list of matches found for this report.
          type: array
          items:
            type: object
            properties:
              domain:
                type: object
                properties:
                  url:
                    type: string
                    description: The URL of the matched domain.
                  screenshot_url:
                    type: string
                    description: The URL of the screenshot for the matched domain.
                  classification:
                    type: string
                    description: The classification of the matched domain.
        root_domain:
          type: object
          properties:
            domain:
              type: string
              description: The root domain associated with the reported URL.
            registrar:
              type: string
              description: The registrar of the root domain.
            ip_address:
              type: string
              description: The IP address associated with the root domain.
            country_code:
              type: string
              description: The country code of the root domain's server location.
            hosting_provider:
              type: string
              description: The hosting provider for the root domain.
        audit_logs:
          description: A list of changes made to this report.
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        tags:
          description: A list of tags associated with this report.
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the tag.
    ReportSource:
      description: How the report was sourced.
      type: string
      enum:
      - Manual Upload
      - API Upload
      - Social Media API
      - Web Search API
      - Domains Feed
      - Phishing Feed
      - Marketplace API
      - Ads Feed
      - Dark Web Feed
      - SSL Transparency Logs
      - Pivot
      - Abuse Box
      - Brand Abusebox
      - Email Inbox
      - Web Beacon
      - Other
      - Crawler
    ReportStatus:
      description: 'Status of which queue the report is in.

        (Note: taken_down is equivalent to Resolved in the Doppel Vision App)

        '
      type: string
      enum:
      - doppel_review
      - needs_confirmation
      - actioned
      - taken_down
      - monitoring
      - archived
    ReportSurfacedPayload:
      type: object
      description: Payload type for the "Report Surfaced" webhook.
      required:
      - report_id
      - display_id
      - doppel_url
      - timestamp
      - urls
      properties:
        report_id:
          type: string
          format: uuid
          description: ID of the surfaced report.
          example: efdad1e5-e8ae-4eb3-8aa6-fe539b05f97e
        display_id:
          type: string
          description: Display ID of the surfaced report.
          example: ABC-12345
        doppel_url:
          type: string
          description: Doppel URL of the surfaced report.
          example: https://app.doppel.com/domains/ABC-12345
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the webhook notification.
          example: '2024-04-28T23:59:59.123456'
        urls:
          type: array
          items:
            type: string
            description: URLs included in the surfaced report.
            example: https://example.surfaced-domain.com
          example:
          - https://surfaced-domain.com
          - https://subdomain1.surfaced-domain.com
          - https://subdomain2.surfaced-domain.com
    SMSResponsePayload:
      type: object
      description: Payload type for the "SMS Response" webhook.
      required:
      - message_sid
      - from_number
      - to_number
      - body
      - timestamp
      - campaign_id
      properties:
        message_sid:
          type: string
          description: Twilio message SID for the incoming SMS.
          example: SM1234567890abcdef
        from_number:
          type: string
          description: Phone number that sent the SMS response.
          example: '+1234567890'
        to_number:
          type: string
          description: Phone number that received the SMS (your Twilio number).
          example: '+1987654321'
        body:
          type: string
          description: Content of the SMS response.
          example: Yes, I received the phishing email
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the SMS was received.
          example: '2024-04-28T23:59:59.123456'
        campaign_id:
          type: string
          description: Identifier for the outreach campaign this response belongs to.
          example: phishing_awareness_2024_q1
        user_id:
          type: string
          description: Optional user identifier if available from the campaign.
          example: user_12345
        metadata:
          type: object
          description: Additional metadata about the SMS response.
          properties:
            message_type:
              type: string
              description: Type of message (e.g., 'sms', 'mms').
              example: sms
            num_media:
              type: integer
              description: Number of media files attached (for MMS).
              example: 0
            media_urls:
              type: array
              items:
                type: string
              description: URLs of media files if any were attached.
              example: []
    Severity:
      description: 'Severity level assigned to the alert.

        - `high`: Confirmed or high-confidence threat requiring immediate action.

        - `medium`: Likely threat that needs further investigation.

        - `low`: Low-confidence signal; may be benign.

        '
      type: string
      enum:
      - high
      - medium
      - low
    TagActionType:
      description: 'Action to take on a tag for an alert.

        - `add`: Associate the named tag with the alert.

        - `remove`: Remove the named tag from the alert.

        '
      type: string
      enum:
      - add
      - remove
    UrlSurfacedPayload:
      type: object
      description: Payload type for the "URL Surfaced" webhook.
      required:
      - url
      - report_id
      - doppel_url
      - timestamp
      properties:
        url:
          type: string
          description: URL which has been surfaced in the system.
          example: https://example.surfaced-domain.com
        report_id:
          type: string
          format: uuid
          description: ID of the report the URL is associated with.
          example: efdad1e5-e8ae-4eb3-8aa6-fe539b05f97e
        doppel_url:
          type: string
          description: Doppel URL of the associated report.
          example: https://app.doppel.com/domains/efdad1e5-e8ae-4eb3-8aa6-fe539b05f97e
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the webhook notification.
          example: '2024-04-28T23:59:59.123456'
